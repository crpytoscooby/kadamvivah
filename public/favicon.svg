<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KadamVivah logo">
  <defs>
    <linearGradient id="kvBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E11D33"/>
      <stop offset="1" stop-color="#A50D22"/>
    </linearGradient>
    <linearGradient id="kvGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBE29A"/>
      <stop offset="1" stop-color="#E0A030"/>
    </linearGradient>
  </defs>

  <!-- Brand badge -->
  <rect width="64" height="64" rx="15" fill="url(#kvBg)"/>

  <!-- Shirorekha (top bar of Devanagari) with a small kunku dot = Marathi identity -->
  <rect x="13" y="15" width="38" height="3.4" rx="1.7" fill="url(#kvGold)"/>
  <circle cx="32" cy="16.7" r="2.6" fill="#FFFFFF"/>
  <circle cx="32" cy="16.7" r="1.2" fill="#A50D22"/>

  <!-- Mangalsutra chain: two strands descending to the pendant -->
  <path d="M23 18.6 C21.2 27 23.5 32 28.5 35" stroke="url(#kvGold)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M41 18.6 C42.8 27 40.5 32 35.5 35" stroke="url(#kvGold)" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- The two vati (gold bowls) united as one pendant -->
  <circle cx="27.5" cy="39" r="6.4" fill="url(#kvGold)"/>
  <circle cx="36.5" cy="39" r="6.4" fill="url(#kvGold)"/>
  <!-- thin rims so they read as bowls, not eyes -->
  <circle cx="27.5" cy="39" r="6.4" fill="none" stroke="#A50D22" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="36.5" cy="39" r="6.4" fill="none" stroke="#A50D22" stroke-opacity="0.25" stroke-width="1"/>
  <path d="M23.5 37 Q27.5 40 31.5 37" stroke="#A50D22" stroke-opacity="0.30" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <path d="M32.5 37 Q36.5 40 40.5 37" stroke="#A50D22" stroke-opacity="0.30" stroke-width="1.1" fill="none" stroke-linecap="round"/>

  <!-- Small heart nestled where the two vati meet: union -->
  <path d="M32 46.4 C32 46.4 29 44 29 42 C29 40.9 29.8 40.3 30.6 40.3 C31.2 40.3 31.7 40.7 32 41.2 C32.3 40.7 32.8 40.3 33.4 40.3 C34.2 40.3 35 40.9 35 42 C35 44 32 46.4 32 46.4 Z" fill="#FFFFFF"/>
</svg>
